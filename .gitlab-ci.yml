variables:
  DOCKER_RUST: rust:1.85.0
  DOCKER_DOCKER: docker:27.5.1
  DOCKER_GITLAB_RELEASE: registry.gitlab.com/gitlab-org/release-cli:latest
  DOCKER_ANSIBLE: serversideup/ansible:8.7.0-alpine3.20-python3.12

stages:
  - test
  - build
  - release
  - verify
  - deploy
  # - test
  # - build
  # - release

run_unit_tests:
  stage: test
  image: $DOCKER_RUST
  script:
    - cargo install cargo-tarpaulin
    - cd backend
    - cargo tarpaulin --include-files *domain*
  coverage: '/^\d+.\d+% coverage/'

build_docker_image:
  stage: build
  image: $DOCKER_DOCKER
  dependencies:
  - run_unit_tests
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""              #Disables TLS
  script:
    - docker pull mongo:8 
    - docker compose -f docker-compose.build.yml build --no-cache
    - docker save -o rusty-minesweeper.tar rusty-minesweeper-backend rusty-minesweeper-frontend mongo
    - tar -zcf rusty-minesweeper_v0.$CI_PIPELINE_IID.tar.gz rusty-minesweeper.tar docker-compose.yml
    - echo "OLD_CI_JOB_ID=$CI_JOB_ID" > envar.txt
  # needs: ["run_unit_tests"]
  resource_group: default
  artifacts:
    name: rusty-minesweeper
    paths:
      - $CI_PROJECT_DIR/rusty-minesweeper_v0.$CI_PIPELINE_IID.tar.gz
      - envar.txt


release_minesweeper_tarball:
  stage: release
  image: $DOCKER_GITLAB_RELEASE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
  - build_docker_image
  before_script:
    - source envar.txt
    - git config --global user.email "ci-bot@git.sogyo.nl"
    - git config --global user.name "GitLab CI Bot"
    - git remote set-url origin "https://oauth2:$CI_PUSH_TOKEN@git.sogyo.nl/abaars/rusty-minesweeper.git"
  script:
    - echo "Running release_job for pipeline $CI_PIPELINE_IID"
    - git tag "v0.$CI_PIPELINE_IID" $CI_COMMIT_SHA
    - git push origin "v0.$CI_PIPELINE_IID"
    - release-cli create --name "Release v0.$CI_PIPELINE_IID"
        --tag-name "v0.$CI_PIPELINE_IID"
        --description "Release "v0.$CI_PIPELINE_IID""
        --ref "$CI_COMMIT_SHA"
        --assets-link "{\"name\":\"Docker image\",\"url\":\"$CI_PROJECT_URL/-/jobs/$OLD_CI_JOB_ID/artifacts/file/rusty-minesweeper_v0.$CI_PIPELINE_IID.tar.gz\"}"
  # needs: ["build_docker_image"]
  resource_group: default



verify_ansible_playbook:
  stage: verify
  image: 
    name: $DOCKER_ANSIBLE
    entrypoint: ['sh', '-c', 'exec su ansible -c sh']
  dependencies:
  - build_docker_image
  before_script:
    - pip install infisicalsdk
    - ansible-galaxy collection install infisical.vault
    - cp ansible_launch_app/.ansible.cfg ~/.ansible.cfg
  script:
    - ansible-playbook --syntax-check ansible_get_key/playbook_key.yml
    - ansible-playbook --check ansible_get_key/playbook_key.yml
    - ansible-playbook ansible_get_key/playbook_key.yml           # <- the key needs to be present for the subsequent checks
    - ansible-playbook --inventory ansible_launch_app/inventory.yml --syntax-check ansible_launch_app/playbook_vm.yml
    - ansible-playbook --inventory ansible_launch_app/inventory.yml --check ansible_launch_app/playbook_vm.yml
  # needs: ["build_docker_image"]
  resource_group: default
  allow_failure: true



deploy_minesweeper:
  stage: deploy
  image: 
    name: $DOCKER_ANSIBLE
    entrypoint: ['sh', '-c', 'exec su ansible -c sh'] # necessary to make the image run as 'ansible' rather than 'root', based on the workaround for alpine linux at https://gitlab.com/gitlab-org/gitlab-runner/-/issues/2750
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
  dependencies:
  - verify_ansible_playbook
  before_script:
    - pip install infisicalsdk
    - ansible-galaxy collection install infisical.vault
    - cp ansible_launch_app/.ansible.cfg ~/.ansible.cfg
  script:
    - ansible-playbook ansible_get_key/playbook_key.yml
    - ansible-playbook -v --inventory ansible_launch_app/inventory.yml ansible_launch_app/playbook_vm.yml
  # needs: ["verify_ansible_playbook"]
  resource_group: default
